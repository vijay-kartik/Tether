name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow with an invalid expression is rejected at validation time: the run fails instantly
  # with no job and no log, which is how a broken release workflow reached a tag unnoticed.
  # Linting them here turns that into a failed PR check instead.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  build:
    name: Build SDK & sample app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # androidx 1.19 requires consumers to compile against API 37.
      - name: Install SDK platforms
        run: |
          yes | sdkmanager "platforms;android-37.0" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release AARs
        run: ./gradlew :tether-core:assembleRelease :tether-ui:assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble sample app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tether-artifacts
          path: |
            tether-core/build/outputs/aar/*.aar
            tether-ui/build/outputs/aar/*.aar
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
